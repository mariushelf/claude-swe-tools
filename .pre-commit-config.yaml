minimum_pre_commit_version: "3.2.0"
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, post-commit, post-checkout, post-merge, post-rewrite]
repos:
  - repo: local
    hooks:
      - id: claude-plugin-validate
        name: Validate Claude Code plugin
        entry: claude plugin validate .
        language: system
        files: \.claude-plugin/
        pass_filenames: false
      - id: graphify
        name: graphify update
        entry: sh scripts/graphify-update.sh
        language: system
        stages: [post-commit, post-checkout, post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
