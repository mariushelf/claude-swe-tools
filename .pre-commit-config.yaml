repos:
  - repo: local
    hooks:
      - id: claude-plugin-validate
        name: Validate Claude Code plugin
        entry: claude plugin validate .
        language: system
        files: \.claude-plugin/
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
